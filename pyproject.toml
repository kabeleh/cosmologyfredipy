[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmologyfredipy"
version = "0.1.0"
description = "A small FrediPy demonstration for primordial-spectrum reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Kay Lehnert", email = "k.lehnert@protonmail.com" },
]
dependencies = [
  "fredipy==0.2.1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/kabeleh/cosmologyfredipy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
