name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Verify inputs
        run: python tools/verify_inputs.py
      - name: Lint and format check
        run: |
          python -m ruff check src scripts tests tools
          python -m ruff format --check src scripts tests tools
      - name: Test
        run: python -m pytest
      - name: Reproduce analysis
        run: |
          python scripts/run_analysis.py
          test -s results/summary.json
          test -s paper/figures/fredholm_operator.pdf
          test -s paper/figures/synthetic_reconstruction.pdf
          test -s paper/figures/planck_reconstruction.pdf
      - name: Install paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk poppler-utils qpdf texlive-fonts-recommended texlive-latex-extra
      - name: Build and check paper
        run: |
          sh paper/build.sh
          qpdf --check paper/main.pdf
          if pdffonts paper/main.pdf | grep -q "Type 3"; then
            echo "paper/main.pdf contains Type 3 fonts" >&2
            exit 1
          fi
